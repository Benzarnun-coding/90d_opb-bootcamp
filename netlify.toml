# ============================================================
# Netlify — เว็บนี้เป็นไฟล์นิ่งล้วน ไม่ต้อง build
# ============================================================
[build]
  publish = "."
  command = ""

# ลิงก์สั้นสำหรับแจกคน
#   /play  = โหมดทดลองเล่น (ข้อมูลปลอมในเครื่องของคนเปิด ไม่แตะฐานข้อมูลจริง)
#   /watch = ดูสนามจริงแบบไม่ต้องล็อกอิน
[[redirects]]
  from = "/play"
  to   = "/?demo"
  status = 302

[[redirects]]
  from = "/demo"
  to   = "/?demo"
  status = 302

[[redirects]]
  from = "/watch"
  to   = "/#watch"
  status = 302

# ไม่ต้องเอาไฟล์ฝั่งฐานข้อมูลกับสคริปต์ dev ขึ้นเว็บ
[[redirects]]
  from = "/backend/*"
  to   = "/404.html"
  status = 404

[[redirects]]
  from = "/serve.js"
  to   = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

# config.js ห้าม cache ไม่งั้นเปลี่ยนคีย์แล้วคนยังได้ของเก่า
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/install"
  to   = "/install.html"
  status = 302
